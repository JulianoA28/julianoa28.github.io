<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dota 2 Randomizer</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main>
    <header>
      <h1>
        Dota 2 Randomizer
        <span class="info" tabindex="0" role="img" aria-label="Every hero receives Boots of Travel, except Centaur Warrunner; every hero, including Centaur, may also receive Guardian Greaves or Boots of Bearing. Click a Hand of Midas to swap it for another item." 
          data-tip="Every hero receives Boots of Travel, except Centaur Warrunner; every hero, including Centaur, may also receive Guardian Greaves or Boots of Bearing. Click a Hand of Midas to swap it for another item.">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
            <circle cx="12" cy="12" r="10"/>
            <path d="M12 11v6"/>
            <path d="M12 7h.01"/>
          </svg>
        </span>
      </h1>
    </header>

    <p id="error" class="error" hidden></p>

    <section id="result" hidden>
      <div class="hero">
        <img id="hero-icon" alt="">
        <h2 id="hero-name"></h2>
      </div>

      <ul id="build" class="build"></ul>

      <div class="actions">
        <button id="roll-all" class="primary">Randomize</button>
        <button id="roll-hero">Reroll hero</button>
        <button id="roll-build">Reroll build</button>
      </div>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
